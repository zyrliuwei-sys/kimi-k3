<svg width="220" height="44" viewBox="0 0 220 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Featured on There's An AI For That">
  <!-- Background pill -->
  <rect x="1" y="1" width="218" height="42" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />

  <!-- Robot / AI mascot icon -->
  <g transform="translate(14, 10)">
    <rect x="0" y="4" width="22" height="18" rx="5" fill="#0f172a" />
    <!-- antenna -->
    <rect x="10" y="0" width="2" height="5" rx="1" fill="#0f172a" />
    <circle cx="11" cy="0" r="1.8" fill="#14b8a6" />
    <!-- eyes -->
    <circle cx="6.5" cy="12" r="2.2" fill="#14b8a6" />
    <circle cx="15.5" cy="12" r="2.2" fill="#14b8a6" />
    <!-- mouth -->
    <rect x="7.5" y="17" width="7" height="1.6" rx="0.8" fill="#14b8a6" />
  </g>

  <!-- Text -->
  <text x="46" y="19" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#6b7280" letter-spacing="0.3">Featured on</text>
  <text x="46" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" letter-spacing="-0.2">There's An AI For That</text>
</svg>
